<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>PEK.A.ROO — Reset Password</title>
   <link rel="stylesheet" href="css/styles.css">
</head>

<body class="auth-page">

   <div class="auth-card">

      <div class="auth-logo">
         <img src="images/logo.avif" alt="Pekaroo Logo">
         <span class="brand">PEK.A.ROO</span>
         <span class="subtitle">Reset your password</span>
      </div>

      <h2>Forgot Password?</h2>
      <p style="text-align:center; color: var(--brown-soft); font-size:14px; margin-bottom:24px; line-height:1.6;">
         Enter your email and we'll send you a link to reset your password.
      </p>

      <div class="field">
         <label for="email">Email Address</label>
         <input type="email" id="email" placeholder="you@example.com">
      </div>

      <button class="btn-primary" onclick="handleReset()">Send Reset Link</button>

      <div class="auth-footer">
         <a href="index.html">Back to Sign In</a>
      </div>

   </div>

   <div id="toast"></div>
   <script type="module" src="js/app.js"></script>
   <script>
      function handleReset() {
         // redirect after toast
         resetPassword();
         setTimeout(() => {
            window.location.href = "index.html";
         }, 2500);
      }
   </script>
</body>

</html>
