<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>PEK.A.ROO — Cart</title>
   <link rel="stylesheet" href="css/styles.css">
</head>

<body class="cart-page">

   <!-- ===== NAVBAR ===== -->
   <nav class="navbar">
      <a class="logo-area" href="dashboard.html">
         <img src="images/logo.avif" alt="Logo">
         <span class="brand">PEK.A.ROO</span>
      </a>

      <div class="nav-links">
         <a href="dashboard.html" class="nav-btn">Home</a>
         <a href="cart.html" class="nav-btn active-nav">Cart</a>
         <a href="profile.html" class="nav-btn">Profile</a>
         <button class="nav-btn logout-btn" onclick="logout()">Logout</button>
      </div>
   </nav>

   <!-- ===== CART BODY ===== -->
   <div class="cart-body">
      <div class="cart-header">
         <h2>Your Cart</h2>
         <a href="my-orders.html" class="btn-myOrders">My Orders</a>
      </div>
      <p class="cart-sub">Review your items before placing an order.</p>

      <div id="cartItems"></div>

      <div class="cart-summary" id="cartSummary" style="display:none;">
         <div class="total-row">
            <span class="total-label">Order Total</span>
            <span class="total-amount" id="total">₱0</span>
         </div>
         <button class="btn-checkout" onclick="checkout()">Place Order (COD)</button>
      </div>
   </div>

   <div id="toast"></div>
   <script type="module" src="js/app.js"></script>

   <!-- Override loadCart to use new markup -->
   <script>
      // Patch loadCart after module loads
      document.addEventListener('DOMContentLoaded', () => {
         // slight delay so module is ready
         setTimeout(patchCart, 200);
      });

      function patchCart() {
         let cart = JSON.parse(localStorage.getItem("cart")) || [];
         const cartDiv = document.getElementById("cartItems");
         const summary = document.getElementById("cartSummary");
         const totalEl = document.getElementById("total");
         if (!cartDiv) return;

         if (cart.length === 0) {
            cartDiv.innerHTML = `
          <div class="empty-cart">
            <span>HUNGRY</span>
            <p>Your cart is empty. <a href="dashboard.html" style="color:var(--green);font-weight:600;">Browse stores now.</a></p>
          </div>`;
            return;
         }

         let total = 0;
         cartDiv.innerHTML = "";

         cart.forEach((item, index) => {
            total += item.price * item.quantity;
            cartDiv.innerHTML += `
          <div class="cart-item">
            <div class="cart-item-info">
              <h3>${item.name}</h3>
              <p class="item-price">₱${item.price.toFixed(2)} each</p>
              <p class="item-qty">Qty: ${item.quantity}</p>
            </div>
            <button class="btn-remove" onclick="removeFromCart(${index}); setTimeout(patchCart, 100);">Remove</button>
          </div>`;
         });

         totalEl.innerText = "₱" + total.toFixed(2);
         summary.style.display = "block";
      }
   </script>
</body>

</html>
