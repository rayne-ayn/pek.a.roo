<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PEK.A.ROO — Login</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <img src="images/logo.avif" alt="Pekaroo Logo">
      <span class="brand">PEK.A.ROO</span>
      <span class="subtitle">Your neighborhood, delivered.</span>
    </div>

    <h2>Welcome back</h2>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="btn-primary" onclick="login()">Sign In</button>

    <div class="auth-footer">
      <a href="forgot.html">Forgot password?</a><br>
      Don't have an account? <a href="signup.html">Sign up</a>
    </div>

  </div>

  <div id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>

</html>
