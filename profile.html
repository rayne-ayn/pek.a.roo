<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>PEK.A.ROO — My Profile</title>
   <link rel="stylesheet" href="css/styles.css">
</head>

<body class="profile-page">

   <!-- NAVBAR -->
   <nav class="navbar">
      <a class="logo-area" href="dashboard.html">
         <img src="images/logo.avif" alt="Logo">
         <span class="brand">PEK.A.ROO</span>
      </a>
      <div class="nav-links">
         <a href="dashboard.html" class="nav-btn">Home</a>
         <a href="cart.html" class="nav-btn">Cart</a>
         <a href="profile.html" class="nav-btn active-nav">Profile</a>
         <button class="nav-btn logout-btn" onclick="logout()">Logout</button>
      </div>
   </nav>

   <!-- PROFILE BODY -->
   <div class="profile-body">

      <div class="profile-header">
         <div class="profile-avatar" id="avatarInitial">?</div>
         <div class="profile-header-text">
            <h2 id="profileName">Loading...</h2>
            <p id="profileEmail">—</p>
         </div>
      </div>

      <!-- Personal Info -->
      <div class="profile-section">
         <div class="profile-section-title">Personal Information</div>

         <div class="profile-field">
            <label>First Name</label>
            <input type="text" id="fname" disabled>
         </div>
         <div class="profile-field">
            <label>Email</label>
            <input type="email" id="email" disabled>
         </div>
         <div class="profile-field">
            <label>Phone</label>
            <input type="text" id="phone" disabled>
         </div>
         <div class="profile-field">
            <label>Address</label>
            <input type="text" id="address" disabled>
         </div>
      </div>

      <!-- Actions -->
      <div class="profile-actions">
         <button class="btn-edit" id="editBtn" onclick="toggleEdit()">Edit Profile</button>
         <button class="btn-save" id="saveBtn" onclick="saveProfile()" style="display:none;">Save Changes</button>
      </div>

   </div>

   <div id="toast"></div>
   <script type="module" src="js/app.js"></script>
   <script type="module" src="js/profile.js"></script>
</body>

</html>
