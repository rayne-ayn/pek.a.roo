<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>PEK.A.ROO — Rider Profile</title>
   <link rel="stylesheet" href="css/styles.css">
</head>

<body class="profile-page">

   <nav class="navbar">
      <a class="logo-area" href="rider-dashboard.html">
         <img src="images/logo.avif" alt="Logo">
         <span class="brand">PEK.A.ROO</span>
      </a>
      <div class="nav-links">
         <a href="rider-dashboard.html" class="nav-btn">Dashboard</a>
         <a href="rider-profile.html" class="nav-btn active-nav">My Profile</a>
         <button class="nav-btn logout-btn" onclick="logout()">Logout</button>
      </div>
   </nav>

   <div class="profile-body">
      <div class="profile-header">
         <div class="profile-avatar" id="avatarInitial">?</div>
         <div class="profile-header-text">
            <h2 id="profileName">Loading…</h2>
            <p id="profileEmail">—</p>
         </div>
      </div>

      <div class="profile-section">
         <div class="profile-section-title">Rider Information</div>
         <div class="profile-field">
            <label>First Name</label>
            <input type="text" id="fname" disabled>
         </div>
         <div class="profile-field">
            <label>Email</label>
            <input type="email" id="email" disabled>
         </div>
         <div class="profile-field">
            <label>Phone</label>
            <input type="text" id="phone" disabled>
         </div>
         <div class="profile-field">
            <label>Vehicle</label>
            <input type="text" id="vehicle" disabled>
         </div>
         <div class="profile-field">
            <label>Status</label>
            <select id="status" disabled
               style="flex:1;border:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:14.5px;color:var(--brown);">
               <option value="available">Available</option>
               <option value="busy">Busy</option>
               <option value="offline">Offline</option>
            </select>
         </div>
      </div>

      <div class="profile-actions">
         <button class="btn-edit" id="editBtn" onclick="toggleEdit()">Edit Profile</button>
         <button class="btn-save" id="saveBtn" onclick="saveProfile()" style="display:none;">Save Changes</button>
      </div>
   </div>

   <div id="toast"></div>
   <script type="module" src="js/app.js"></script>
   <script type="module" src="js/profile.js"></script>
</body>

</html>
